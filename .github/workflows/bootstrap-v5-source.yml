name: Materialize v5 code in feature branch
on:
  push:
    branches: [feature/owner-dashboard-v1]
    paths: [.github/workflows/bootstrap-v5-source.yml]
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply v5 patch and commit in this development branch only
        run: |
          git status --short
          patch --batch --fuzz=0 -p1 --dry-run < .ci-v5-input/goodjob-c009-fixes-v5.patch
          patch --batch --fuzz=0 -p1 < .ci-v5-input/goodjob-c009-fixes-v5.patch
          git add backend whatsapp-plugin
          git -c user.name="GoodJob CI" -c user.email="actions@users.noreply.github.com" commit -m "feat: materialize GoodJob v5 in development branch"
          git push origin HEAD:feature/owner-dashboard-v1
