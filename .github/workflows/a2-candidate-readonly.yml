name: A2 candidate security tests (read-only)
on:
  push:
    branches: [deps/a2-validation-hardening-20261117]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      CI: 'true'
      NODE_ENV: test
      JWT_SECRET: goodjob-a2-ci-jwt-secret-not-for-production-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Frozen baseline
        run: |
          npm ci --no-audit --no-fund
          npm --prefix whatsapp-plugin ci --no-audit --no-fund
      - name: Same-major candidate upgrades and full regression
        run: |
          npm install --save-exact -w integration-worker @modelcontextprotocol/client@2.4.0 mysql2@3.24.6 zod@4.6.7
          npm install --save-exact -D -w integration-worker @modelcontextprotocol/node@2.1.2 @modelcontextprotocol/server@2.4.0
          npm install -w backend 'mysql2@^3.24.6'
          npm install -D -w frontend 'vite@^6.4.3'
          npm ci --no-audit --no-fund
          npm --prefix whatsapp-plugin ci --no-audit --no-fund
          npm run build
          npm test
          mkdir -p a2-evidence
          cp package-lock.json a2-evidence/stage1-package-lock.json
          cp backend/package.json a2-evidence/stage1-backend-package.json
          cp frontend/package.json a2-evidence/stage1-frontend-package.json
          cp integration-worker/package.json a2-evidence/stage1-worker-package.json
          npm audit --omit=dev --json > a2-evidence/stage1-root-prod.json || true
      - name: Nodemailer 10 candidate and mail regressions
        run: |
          npm install -w backend 'nodemailer@^10.0.0'
          npm uninstall -D -w backend @types/nodemailer
          npm ci --no-audit --no-fund
          npm run build
          npm run test:email-delivery --workspace backend
          npm run test:prospect-outreach:http --workspace backend
          npm test
          cp package-lock.json a2-evidence/stage2-package-lock.json
          cp backend/package.json a2-evidence/stage2-backend-package.json
          npm audit --omit=dev --json > a2-evidence/stage2-root-prod.json || true
      - name: Capture source-backed audit and patch
        if: always()
        run: |
          mkdir -p a2-evidence
          npm audit --omit=dev --json > a2-evidence/root-prod.json || true
          npm --prefix whatsapp-plugin audit --omit=dev --json > a2-evidence/plugin-prod.json || true
          git diff --binary > a2-evidence/dependency-candidate.patch
          git diff --name-only > a2-evidence/changed-files.txt
          cp package-lock.json a2-evidence/package-lock.json
          cp integration-worker/package.json a2-evidence/integration-worker-package.json
          cp backend/package.json a2-evidence/backend-package.json
          cp frontend/package.json a2-evidence/frontend-package.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a2-candidate-evidence
          path: a2-evidence/
          if-no-files-found: warn
