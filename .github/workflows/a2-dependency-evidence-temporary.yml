name: A2 dependency evidence (temporary)
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-and-prod-install:
    if: github.head_ref == 'deps/hardening-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frozen dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix whatsapp-plugin ci --no-audit --no-fund
      - name: Record actual security audit JSON
        shell: bash
        run: |
          mkdir -p audit/after
          npm audit --json > audit/after/root-all.json || true
          npm audit --omit=dev --json > audit/after/root-prod.json || true
          npm --prefix whatsapp-plugin audit --json > audit/after/plugin-all.json || true
          npm --prefix whatsapp-plugin audit --omit=dev --json > audit/after/plugin-prod.json || true
          node - <<'JS'
          const fs=require('node:fs');
          for(const t of ['root-all','root-prod','plugin-all','plugin-prod']){
            const p='audit/after/'+t+'.json';
            try {
              const j=JSON.parse(fs.readFileSync(p,'utf8'));
              console.log(t,JSON.stringify(j.metadata?.vulnerabilities||{}));
              console.log('high:',Object.entries(j.vulnerabilities||{}).filter(([k,v])=>v.severity==='high'||v.severity==='critical').map(([k])=>k).join(', '));
            } catch(e) { console.error('invalid audit JSON',p,String(e)); process.exitCode=1; }
          }
          JS
      - name: Confirm frozen production tree excludes browser packages
        run: |
          npm pkg delete --workspace @goodjob/integration-connector-sdk scripts.prepare
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          node - <<'JS'
          const fs=require('node:fs'), cp=require('node:child_process');
          const names=['whatsapp-web.js','puppeteer','puppeteer-core','@puppeteer/browsers','vite','@vitejs/plugin-react'];
          let found=[];
          for(const name of names){
            const p='node_modules/'+name;
            const yes=fs.existsSync(p);
            console.log(name,yes?'PRESENT':'absent');
            if(yes)found.push(name);
          }
          if(found.length)throw new Error('Production tree contains forbidden modules: '+found.join(','));
          JS
      - name: Upload A2 source-backed evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a2-audit-evidence-${{ github.run_id }}
          path: audit/after/*.json
          if-no-files-found: warn
