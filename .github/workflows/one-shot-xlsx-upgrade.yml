name: One-shot SheetJS 0.20.3 migration with lockfile verification
on:
  push:
    branches: [fix/predeploy-hardening-20261116]
    paths: [.github/workflows/one-shot-xlsx-upgrade.yml]
permissions:
  contents: write
jobs:
  upgrade:
    if: github.repository == 'zzlongcheng-web/GoodJob'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Replace vulnerable npm registry SheetJS with official fixed tarball
        run: |
          npm install --save --workspace frontend xlsx@https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('frontend/package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const target = 'https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz';
          assert.equal(pkg.dependencies.xlsx, target);
          assert.equal(lock.packages.frontend.dependencies.xlsx, target);
          assert.equal(lock.packages['node_modules/xlsx'].version, '0.20.3');
          assert.equal(lock.packages['node_modules/xlsx'].resolved, target);
          assert.match(lock.packages['node_modules/xlsx'].integrity, /^sha512-/);
          NODE
      - name: Verify reproducible clean npm installation
        run: |
          npm ci
          npm --prefix whatsapp-plugin ci
      - name: Compile entire application with updated Excel parser
        run: npm run build
      - name: Regression tests including customer import and export
        run: npm test
      - name: Assert critical dependency security
        run: |
          npm audit --audit-level=critical
          npm --prefix whatsapp-plugin audit --audit-level=critical
      - name: Commit tested lockfile and remove one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-xlsx-upgrade.yml
          git add frontend/package.json package-lock.json
          git diff --cached --check
          git diff --cached --stat
          git -c user.name="Golden Gain CI" -c user.email="actions@users.noreply.github.com" commit -m "security(deps): pin official SheetJS 0.20.3 and verified npm lockfile"
          git push origin HEAD:fix/predeploy-hardening-20261116
