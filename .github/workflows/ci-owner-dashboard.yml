name: GoodJob manager dashboard full verification

on:
  push:
    branches: [feature/owner-dashboard-v1]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  NODE_ENV: test
  JWT_SECRET: goodjob-management-ci-secret-at-least-32-characters

jobs:
  build:
    name: Complete npm run build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

        shell: bash
        run: |
          echo '3e424d5092e9ed9c35473007fa5f4f1b3fc7dbed5d47563980987f8af291a58a  .ci-v5-input/goodjob-c009-fixes-v5.patch' | sha256sum -c -
          patch --batch --fuzz=0 -p1 --dry-run < .ci-v5-input/goodjob-c009-fixes-v5.patch
          patch --batch --fuzz=0 -p1 < .ci-v5-input/goodjob-c009-fixes-v5.patch
          git diff --stat
      - name: Install root and WhatsApp plugin dependencies
        run: |
          npm ci
          npm --prefix whatsapp-plugin ci
      - name: Build all components
        run: npm run build

  full-tests:
    name: Complete npm test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

        shell: bash
        run: |
          echo '3e424d5092e9ed9c35473007fa5f4f1b3fc7dbed5d47563980987f8af291a58a  .ci-v5-input/goodjob-c009-fixes-v5.patch' | sha256sum -c -
          patch --batch --fuzz=0 -p1 --dry-run < .ci-v5-input/goodjob-c009-fixes-v5.patch
          patch --batch --fuzz=0 -p1 < .ci-v5-input/goodjob-c009-fixes-v5.patch
          git diff --stat
      - name: Install root and WhatsApp plugin dependencies
        run: |
          npm ci
          npm --prefix whatsapp-plugin ci
      - name: Run npm test with all configured self-tests
        run: npm test

  mysql-tests:
    name: Complete npm run test:mysql
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password_only
          MYSQL_DATABASE: goodjob_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      MYSQL_TEST_ADMIN_URL: mysql://root:ci_root_password_only@127.0.0.1:3306/mysql
      MYSQL_TEST_APP_URL: mysql://goodjob_ci:ci_app_password_only@127.0.0.1:3306/
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

        shell: bash
        run: |
          echo '3e424d5092e9ed9c35473007fa5f4f1b3fc7dbed5d47563980987f8af291a58a  .ci-v5-input/goodjob-c009-fixes-v5.patch' | sha256sum -c -
          patch --batch --fuzz=0 -p1 --dry-run < .ci-v5-input/goodjob-c009-fixes-v5.patch
          patch --batch --fuzz=0 -p1 < .ci-v5-input/goodjob-c009-fixes-v5.patch
          git diff --stat
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix whatsapp-plugin ci
      - name: Configure isolated ephemeral MySQL test account
        run: |
          mysql --protocol=tcp --host=127.0.0.1 --port=3306 --user=root --password=ci_root_password_only <<'SQL'
          CREATE USER IF NOT EXISTS 'goodjob_ci'@'%' IDENTIFIED BY 'ci_app_password_only';
          GRANT ALL PRIVILEGES ON *.* TO 'goodjob_ci'@'%';
          FLUSH PRIVILEGES;
          SQL
      - name: Generate temporary test database profile
        run: |
          cat > .env.test.local <<'EOF'
          APP_DATABASE_PROFILE=test
          CRM_STORE=mysql
          CRM_SEED_DEVELOPMENT_DATA=true
          MYSQL_TEST_ADMIN_URL=mysql://root:ci_root_password_only@127.0.0.1:3306/mysql
          MYSQL_TEST_APP_URL=mysql://goodjob_ci:ci_app_password_only@127.0.0.1:3306/
          JWT_SECRET=goodjob-v5-isolated-ci-secret-32-characters-only
          EOF
          chmod 600 .env.test.local
      - name: Run complete MySQL integration suite
        run: npm run test:mysql

  focused-tests:
    name: Parser and security regressions
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

        shell: bash
        run: |
          echo '3e424d5092e9ed9c35473007fa5f4f1b3fc7dbed5d47563980987f8af291a58a  .ci-v5-input/goodjob-c009-fixes-v5.patch' | sha256sum -c -
          patch --batch --fuzz=0 -p1 --dry-run < .ci-v5-input/goodjob-c009-fixes-v5.patch
          patch --batch --fuzz=0 -p1 < .ci-v5-input/goodjob-c009-fixes-v5.patch
          git diff --stat
      - name: Install dependencies and compile connector SDK
        run: |
          npm ci
          npm run build --workspace @goodjob/integration-connector-sdk
      - name: Run new text parser test script
        run: npm run test:lead-text --workspace backend
      - name: Run new lead text HTTP API tests
        run: npm run test:lead-text-api --workspace backend
      - name: Run management scoreboard and permissions test
        run: npm run test:management-performance --workspace backend
      - name: Run permission and API contract tests independently
        shell: bash
        run: |
          cd backend
          export PATH="$PWD/../node_modules/.bin:$PATH"
          failed=0
          for file in src/agent-api-contracts-test.ts src/lead-deletion-test.ts src/customer-activity-edit-test.ts src/iam/iam-foundation-test.ts src/iam/iam-capabilities-test.ts src/lead-assignment-test.ts; do
            echo "::group::$file"
            if node ../scripts/run-with-env.mjs NODE_ENV=test tsx "$file"; then
              echo "PASS $file"
            else
              echo "FAIL $file"
              failed=1
            fi
            echo '::endgroup::'
          done
          exit "$failed"

  remaining-tests:
    name: Frontend worker runner WhatsApp tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

        shell: bash
        run: |
          echo '3e424d5092e9ed9c35473007fa5f4f1b3fc7dbed5d47563980987f8af291a58a  .ci-v5-input/goodjob-c009-fixes-v5.patch' | sha256sum -c -
          patch --batch --fuzz=0 -p1 --dry-run < .ci-v5-input/goodjob-c009-fixes-v5.patch
          patch --batch --fuzz=0 -p1 < .ci-v5-input/goodjob-c009-fixes-v5.patch
          git diff --stat
      - name: Install root and WhatsApp plugin dependencies
        run: |
          npm ci
          npm --prefix whatsapp-plugin ci
      - name: Test each downstream workspace independently
        shell: bash
        run: |
          npm run build --workspace @goodjob/integration-connector-sdk
          failed=0
          for workspace in frontend integration-worker @goodjob/local-runner; do
            echo "::group::$workspace"
            if npm run test --workspace "$workspace"; then
              echo "PASS $workspace"
            else
              echo "FAIL $workspace"
              failed=1
            fi
            echo '::endgroup::'
          done
          echo '::group::WhatsApp plugin'
          if npm --prefix whatsapp-plugin test; then
            echo 'PASS whatsapp-plugin'
          else
            echo 'FAIL whatsapp-plugin'
            failed=1
          fi
          echo '::endgroup::'
          exit "$failed"
