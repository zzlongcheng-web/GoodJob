name: Apply user-reviewed Golden Gain patches (one shot)
on:
  push:
    branches: [feature/golden-gain-candidate]
    paths: [.github/workflows/apply-review-patches.yml]
permissions:
  contents: write
jobs:
  apply-reviewed-patches:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify exact attachment content and strict dry-run
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "a1e30e5051acb06488814b4c1af7426c60c1efbe15d2e85766fe9ea0ea747dd3  .review-input/golden-gain-rename.patch" | sha256sum -c -
          echo "c524039f5f5c6d2b52a41f681862712df11cbc8c8be50b67ed349e231de46d3a  .review-input/premerge-cleanup.patch" | sha256sum -c -
          cp .review-input/premerge-cleanup.patch /tmp/premerge-cleanup.patch
          cp .review-input/golden-gain-rename.patch /tmp/golden-gain-rename.patch
          printf '\n' >> /tmp/premerge-cleanup.patch
          printf '\n' >> /tmp/golden-gain-rename.patch
          patch --batch --fuzz=0 -p1 --dry-run < /tmp/premerge-cleanup.patch
          patch --batch --fuzz=0 -p1 --dry-run < /tmp/golden-gain-rename.patch
      - name: Apply both reviewed patches and remove one-shot scaffolding
        shell: bash
        run: |
          set -Eeuo pipefail
          patch --batch --fuzz=0 -p1 < /tmp/premerge-cleanup.patch
          patch --batch --fuzz=0 -p1 < /tmp/golden-gain-rename.patch
          test ! -e .github/workflows/bootstrap-v5-source.yml
          test ! -e .github/workflows/verify-c009-v5.yml
          test ! -e .ci-v5-input/goodjob-c009-fixes-v5.patch
          git rm -rf -- .review-input .github/workflows/apply-review-patches.yml
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git -c user.name="Golden Gain CI" -c user.email="actions@users.noreply.github.com" commit -m "feat: rebrand Golden Gain and remove temporary CI source patch workflow"
          git push origin HEAD:feature/golden-gain-candidate
