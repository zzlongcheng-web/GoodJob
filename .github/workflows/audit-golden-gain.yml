name: Golden Gain critical dependency audit
on:
  push:
    branches: [feature/golden-gain-hardening-20261114]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm --prefix whatsapp-plugin ci
      - name: Check root dependency security
        run: npm audit --audit-level=critical
      - name: Check WhatsApp dependency security
        if: always()
        run: npm --prefix whatsapp-plugin audit --audit-level=critical
