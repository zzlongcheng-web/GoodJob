name: Golden Gain safe semver dependency candidate preview (temporary)
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  preview:
    name: Preview locked update ${{ matrix.key }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: vite
            target: vite
          - key: body-parser
            target: body-parser
          - key: mcp-client
            target: '@modelcontextprotocol/client'
          - key: mcp-server
            target: '@modelcontextprotocol/server'
          - key: mcp-node
            target: '@modelcontextprotocol/node'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install original locked deps
        run: npm ci
      - name: Preview one package update, never force or commit
        env:
          TARGET: ${{ matrix.target }}
          KEY: ${{ matrix.key }}
        shell: bash
        run: |
          set -e
          mkdir -p audit/preview
          echo "TARGET=$TARGET"
          npm update "$TARGET" --package-lock-only --ignore-scripts
          git diff -- package.json package-lock.json > audit/preview/candidate.patch
          git diff --stat -- package.json package-lock.json > audit/preview/change-stat.txt
          npm audit --json > audit/preview/root-all.json || true
          npm audit --omit=dev --json > audit/preview/root-prod.json || true
          node - <<'NODE'
          const fs=require('node:fs');
          const j=JSON.parse(fs.readFileSync('audit/preview/root-prod.json'));
          console.log('CANDIDATE_PROD '+JSON.stringify(j.metadata?.vulnerabilities||{}));
          NODE
          git status --short
          echo "Change lines:"
          cat audit/preview/change-stat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-candidate-${{ matrix.key }}-${{ github.run_id }}
          path: |
            package.json
            package-lock.json
            audit/preview/
          retention-days: 14
          if-no-files-found: warn
