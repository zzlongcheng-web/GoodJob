name: Apply supplied Golden Gain patches on isolated branch
on:
  push:
    branches: [feature/golden-gain-hardening-20261114]
    paths:
      - .github/workflows/apply-golden-gain-patches.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply premerge cleanup patch first, strictly
        shell: bash
        run: |
          set -Eeuo pipefail
          patch --batch --fuzz=0 -p1 --dry-run < .patch-staging/01-premerge-cleanup.patch
          patch --batch --fuzz=0 -p1 < .patch-staging/01-premerge-cleanup.patch
          test ! -e .github/workflows/bootstrap-v5-source.yml
          test ! -e .github/workflows/verify-c009-v5.yml
          test ! -e .ci-v5-input/goodjob-c009-fixes-v5.patch
      - name: Apply Golden Gain rename patch second, strictly
        shell: bash
        run: |
          set -Eeuo pipefail
          patch --batch --fuzz=0 -p1 --dry-run < .patch-staging/02-golden-gain-rename.patch
          patch --batch --fuzz=0 -p1 < .patch-staging/02-golden-gain-rename.patch
          git diff --check
          grep -q 'Golden Gain CRM' frontend/index.html
      - name: Install root and standalone plugin dependencies
        run: |
          npm ci
          npm --prefix whatsapp-plugin ci
      - name: Apply nonbreaking npm security resolutions in both lockfiles
        shell: bash
        run: |
          set -u
          npm audit fix --no-fund --audit-level=low || true
          npm --prefix whatsapp-plugin audit fix --no-fund --audit-level=low || true
          echo "NPM_AUDIT_ROOT_AFTER"
          npm audit --audit-level=critical || true
          echo "NPM_AUDIT_WHATSAPP_AFTER"
          npm --prefix whatsapp-plugin audit --audit-level=critical || true
      - name: Remove temporary patch payload only
        run: |
          rm -rf .patch-staging
          git diff --check
          if find . -name '*.rej' -o -name '*.orig' | grep -q .; then
            echo 'Unexpected patch reject or backup file'; exit 1
          fi
      - name: Commit reviewed patch result and dependency lockfile updates to isolated branch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git branch --show-current)" = "feature/golden-gain-hardening-20261114"
          git add -A -- . ':(exclude).github/workflows/**'
          git -c user.name="Golden Gain CI" -c user.email="actions@users.noreply.github.com" commit -m "feat: Golden Gain branding, remove bootstrap scripts, resolve npm dependency advisories"
          git push origin HEAD:feature/golden-gain-hardening-20261114
