name: Remediate Golden Gain critical dependency vulnerabilities
on:
  push:
    branches: [feature/golden-gain-hardening-20261114]
    paths: [.github/workflows/npm-remediate-critical.yml]
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies from locked versions
        run: |
          npm ci
          npm --prefix whatsapp-plugin ci
      - name: Target confirmed critical fixes and safe protocol fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --save-dev concurrently@9.2.5 --no-fund
          npm --prefix whatsapp-plugin install --save-dev --save-exact concurrently@9.2.5 vitest@5.1.0 --no-fund
          npm --prefix whatsapp-plugin install --save --save-exact mysql2@3.24.6 undici@6.29.1 --no-fund
          npm audit fix --no-fund || true
          npm --prefix whatsapp-plugin audit fix --no-fund || true
          echo '================ ROOT SECURITY STATUS ================'
          npm audit --audit-level=critical || true
          echo '================ WHATSAPP SECURITY STATUS ================'
          npm --prefix whatsapp-plugin audit --audit-level=critical || true
      - name: Commit only dependency manifests and lockfiles to feature branch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git branch --show-current)" = "feature/golden-gain-hardening-20261114"
          git add package.json package-lock.json whatsapp-plugin/package.json whatsapp-plugin/package-lock.json
          if git diff --cached --quiet; then echo "No dependency changes"; exit 0; fi
          git diff --cached --check
          git -c user.name="Golden Gain CI" -c user.email="actions@users.noreply.github.com" commit -m "fix(security): update critical dependency versions with lockfiles"
          git push origin HEAD:feature/golden-gain-hardening-20261114
